receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  resource:
    attributes:
      - key: deployment.environment
        action: upsert
        value: development

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
    
    #metrics:
    #  receivers: [otlp]
    #  processors: [resource, batch]
    #  exporters: [debug]
    
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug]
