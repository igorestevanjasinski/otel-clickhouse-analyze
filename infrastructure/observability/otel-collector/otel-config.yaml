receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  resource:
    attributes:
      - key: deployment.environment
        action: upsert
        value: development

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200
  
  clickhouse:
    endpoint: tcp://clickhouse:9000?database=observability
    ttl: 720h
    traces_table_name: traces
    logs_table_name: logs
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, clickhouse]
    
    #metrics:
    #  receivers: [otlp]
    #  processors: [resource, batch]
    #  exporters: [debug]
    
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [debug, clickhouse]
